<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: onmyoji-resource:; font-src 'self'; connect-src 'self';">
  <title>工作流画布</title>
  <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/Regular.css">
  <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/Semibold.css">
  <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/Bold.css">
  <link rel="stylesheet" href="/legacy/workflow-editor.css">
  <link rel="stylesheet" href="/legacy/workflow-browser.css">
  <link rel="stylesheet" href="/legacy/ui.css">
  <link rel="stylesheet" href="/legacy/child-order-dnd.css">
  <link rel="stylesheet" href="/legacy/inspector.css">
  <link rel="stylesheet" href="/theme/editor-light.css">
  <link rel="stylesheet" href="/theme/theme.css">
  <script src="/theme/theme.js"></script>
  <link rel="stylesheet" href="/legacy/node-cards.css">
  <link rel="stylesheet" href="/legacy/editor-frame.css">
</head>
<body>
  <header id="topbar">
    <button id="btn-back" class="icon-button hidden" title="返回上一级">←</button>
    <span id="workflow-select" class="topbar-slot workflow-slot"></span>
    <span id="dirty-badge" class="badge hidden">未保存</span>
    <span id="issue-badge" class="badge"></span>
    <span class="spacer"></span>
    <span id="instance-select" class="topbar-slot instance-slot"></span>
    <button id="btn-run" class="primary">运行</button>
    <button id="btn-stop" class="icon-button">停止</button>
    <button id="btn-save" class="primary">保存</button>
    <button id="btn-more" class="icon-button">更多</button>
  </header>
  <nav id="workflow-breadcrumb" aria-label="工作流层级"></nav>
  <div id="external-banner" class="hidden"></div>
  <main id="editor-main">
    <section id="canvas-wrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="viewport-tools">
        <button id="btn-viewport-back" class="icon-button" title="画布后退（上一个位置）">↩</button>
        <button id="btn-viewport-forward" class="icon-button" title="画布前进（下一个位置）">↪</button>
        <button id="btn-arrange" class="icon-button" title="自动排列（先预览，再点顶部「应用排列」）">⤢</button>
        <button id="btn-filter" class="icon-button" title="按状态或类型临时隐藏">☰</button>
        <span class="viewport-tools-separator"></span>
        <button id="btn-zoom-out" class="icon-button" title="缩小">−</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in" class="icon-button" title="放大">＋</button>
      </div>
      <div id="arrange-preview-bar" class="hidden">
        <span id="arrange-preview-text">排列预览</span>
        <span id="arrange-preview-hint">虚线是虚影，点「应用排列」才写入文档（Ctrl+Z 可撤销）</span>
        <button id="btn-arrange-apply" class="primary">应用排列 (Enter)</button>
        <button id="btn-arrange-cancel">取消 (Esc)</button>
      </div>
      <svg id="minimap" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>
    <aside id="inspector">
      <div id="inspector-title">详细信息</div>
      <div id="inspector-empty">选择一个节点</div>
      <div id="inspector-body" class="hidden"></div>
    </aside>
  </main>
  <div id="toast" class="hidden"></div>
  <script src="/shortcuts/shortcuts.js"></script>
  <script src="/shared/tooltip.js"></script>
  <script type="module" src="../canvas/main.ts"></script>
</body>
</html>
