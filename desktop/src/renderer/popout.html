<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: onmyoji-resource: https://avatars.githubusercontent.com; frame-src 'self'; connect-src 'self' ws:;">
  <title>AutoFlow Studio</title>
  <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/Regular.css">
  <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/Semibold.css">
  <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/Bold.css">
  <link rel="stylesheet" href="/legacy/ui.css">
  <link rel="stylesheet" href="/settings/settings.css">
  <link rel="stylesheet" href="/theme/workbench-light.css">
  <link rel="stylesheet" href="/theme/theme.css">
  <script src="/theme/theme.js"></script>
  <link rel="stylesheet" href="/workbench/workbench.css">
</head>
<body>
  <div class="popout-titlebar">
    <span class="popout-title">AutoFlow Studio</span>
    <div class="popout-window-controls" aria-label="窗口控制">
      <button id="popout-always-on-top" type="button" title="顶置" aria-label="顶置" aria-pressed="false"><i data-lucide="pin"></i></button>
      <button id="popout-minimize" type="button" title="最小化" aria-label="最小化"><i data-lucide="minus"></i></button>
      <button id="popout-maximize" type="button" title="最大化" aria-label="最大化"><i data-lucide="square"></i></button>
      <button id="popout-close" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
    </div>
  </div>
  <script src="/shortcuts/shortcuts.js"></script>
  <script src="/shared/tooltip.js"></script>
  <script type="module" src="./shell/popout/entry.ts"></script>
</body>
</html>
