# 本文件只承载开发工具配置；项目不作为可安装包分发，测试从仓库根目录运行。

[tool.ruff]
# 与 mypy.ini 保持一致的解释器目标。
target-version = "py312"
line-length = 160
# 桌面端是独立的 TS/JS 工程，由它自己的工具链负责；tools/ 是本机工具链缓存。
extend-exclude = ["desktop", "tools", ".venv", "artifacts", "logs"]

[tool.ruff.lint]
# 从「真实错误 + 未使用代码」起步，后续可逐步打开 I/UP/B/SIM 等规则。
select = ["E4", "E7", "E9", "F"]
# E402：tests/contract_check.py 需要先设置 sys.path 再导入。
# E702：测试里存在有意的一行多语句。
ignore = ["E402", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
