<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Log Harness</title>
  <link rel="stylesheet" href="../media/run-log.css">
</head>
<body>
<header id="topbar">
  <div class="identity"><span class="mark">RUN</span><div><div id="workflow-name">尚未运行</div><div id="run-meta">等待工作流</div></div></div>
  <div class="spacer"></div>
  <div class="segmented" role="tablist"><button id="tab-steps" class="active" role="tab">步骤</button><button id="tab-engine" role="tab">引擎输出</button></div>
  <label class="auto-scroll"><input id="auto-scroll" type="checkbox" checked> 自动滚动</label>
  <button id="btn-stop" class="icon-button danger" title="停止当前工作流">■</button>
  <button id="btn-clear" class="icon-button" title="清空日志">⌫</button>
</header>
<section id="summary">
  <div class="status-block"><span id="status-dot"></span><span id="status-label">待命</span><strong id="elapsed">00:00.0</strong></div>
  <div class="metric"><span>已完成</span><strong id="completed-count">0</strong></div>
  <div class="metric"><span>失败</span><strong id="failed-count">0</strong></div>
  <div class="metric current"><span>当前节点</span><strong id="current-step">-</strong></div>
  <div id="progress"><span></span></div>
</section>
<main>
  <section id="steps-view">
    <div id="filters" class="filterbar"><button data-filter="tasks" class="active">任务</button><button data-filter="all">全部</button><button data-filter="failed">失败</button></div>
    <div id="empty-state">暂无运行记录</div><div id="step-list"></div>
  </section>
  <section id="engine-view" class="hidden"><pre id="engine-output"></pre></section>
</main>
<div id="lightbox" class="hidden"><button id="lightbox-close" class="icon-button">×</button><img id="lightbox-image" alt="运行截图"></div>
<script>
  window.acquireVsCodeApi = () => ({ postMessage(message) { window.lastPosted = message; } });
</script>
<script src="../media/run-log.js"></script>
<script>
  const now = Date.now() / 1000;
  const thumb = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90"><rect width="160" height="90" fill="#293a42"/><circle cx="118" cy="35" r="24" fill="#d9a441"/><path d="M18 68h124" stroke="#66bb73" stroke-width="7"/><text x="14" y="28" fill="#fff" font-family="sans-serif" font-size="13">MUMU-1</text></svg>');
  const events = [
    { type: 'run_started', run_id: 'workflow-3b6a12e7537b', instance_id: 'mumu-1', status: 'running', ts: now - 18 },
    { type: 'step', step_id: 'wait_challenge', ts: now - 17.8, step: { status: 'running', execution_index: 24, node_kind: 'task', action: 'vision.wait_template' } },
    { type: 'step', step_id: 'wait_challenge', ts: now - 17.6, thumbnail: thumb, step: { status: 'succeeded', execution_index: 24, node_kind: 'task', action: 'vision.wait_template', duration_ms: 214.3 } },
    { type: 'step', step_id: 'tap_challenge', ts: now - 17.5, step: { status: 'running', execution_index: 25, node_kind: 'task', action: 'input.tap_match' } },
    { type: 'step', step_id: 'tap_challenge', ts: now - 17.1, step: { status: 'succeeded', execution_index: 25, node_kind: 'task', action: 'input.tap_match', duration_ms: 381.6 } },
    { type: 'step', step_id: 'wait_ready', ts: now - 16.9, step: { status: 'running', execution_index: 26, node_kind: 'task', action: 'vision.wait_template' } },
    { type: 'step', step_id: 'wait_ready', ts: now - 14.4, thumbnail: thumb, step: { status: 'succeeded', execution_index: 26, node_kind: 'task', action: 'vision.wait_template', duration_ms: 2471.8 } },
    { type: 'step', step_id: 'tap_ready', ts: now - 14.3, step: { status: 'running', execution_index: 27, node_kind: 'task', action: 'input.tap_match' } },
    { type: 'step', step_id: 'tap_ready', ts: now - 14.0, step: { status: 'succeeded', execution_index: 27, node_kind: 'task', action: 'input.tap_match', duration_ms: 284.2 } },
    { type: 'step', step_id: 'wait_victory', ts: now - 13.9, step: { status: 'running', execution_index: 28, node_kind: 'task', action: 'vision.wait_template' } },
  ];
  window.dispatchEvent(new MessageEvent('message', { data: {
    type: 'init', descriptor: { workflow: 'mumu_1_souls_loop.json', instance: 'mumu-1', startedAt: (now - 18) * 1000, status: 'starting' },
    events,
    engineOutput: '2026-08-29 12:04:33 INFO worker.started instance_id=mumu-1\n2026-08-29 12:04:33 INFO run.device_connected backend=mumu\n正在等待战斗胜利...\n',
  } }));
</script>
</body>
</html>
