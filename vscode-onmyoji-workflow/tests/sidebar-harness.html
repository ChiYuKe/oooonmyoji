<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onmyoji Sidebar Harness</title>
  <link rel="stylesheet" href="../media/sidebar.css">
  <style>
    :root {
      --vscode-font-family: "Segoe UI", sans-serif;
      --vscode-foreground: #cccccc;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-sideBar-background: #181818;
      --vscode-sideBarSectionHeader-border: #2b2b2b;
      --vscode-panel-border: #2b2b2b;
      --vscode-focusBorder: #0078d4;
      --vscode-dropdown-foreground: #cccccc;
      --vscode-dropdown-background: #313131;
      --vscode-input-background: #242424;
      --vscode-button-foreground: #ffffff;
      --vscode-button-background: #0e639c;
      --vscode-button-hoverBackground: #1177bb;
      --vscode-button-secondaryForeground: #cccccc;
      --vscode-button-secondaryBackground: #313131;
      --vscode-button-secondaryHoverBackground: #3c3c3c;
      --vscode-editorWidget-background: #202020;
      --vscode-list-hoverForeground: #ffffff;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-list-activeSelectionBackground: #094771;
      --vscode-list-activeSelectionForeground: #ffffff;
      --vscode-icon-foreground: #c5c5c5;
      --vscode-charts-yellow: #cca700;
      --vscode-testing-iconPassed: #73c991;
      --vscode-testing-iconFailed: #f14c4c;
    }
  </style>
</head>
<body>
  <main id="sidebar-root">
    <section class="dock-pane structure-dock" aria-label="工作流导航">
      <div class="dock-tabs" role="tablist" aria-label="左上面板">
        <button class="dock-tab active" data-sidebar-tab="structure" role="tab" aria-selected="true"><span>≣</span><span>结构树</span></button>
        <button class="dock-tab" data-sidebar-tab="controls" role="tab" aria-selected="false"><span>☷</span><span>控制板</span></button>
      </div>
      <div id="structure-panel" class="dock-content" role="tabpanel">
        <div class="dock-toolbar">
          <input id="structure-search" type="search" placeholder="搜索节点" aria-label="搜索结构树节点">
          <button id="collapse-tree" class="toolbar-icon" title="收起全部">⌃</button>
          <button id="expand-tree" class="toolbar-icon" title="展开全部">⌄</button>
        </div>
        <div id="structure-tree" class="structure-tree" role="tree" aria-label="当前工作流结构树"></div>
      </div>
      <div id="controls-panel" class="dock-content hidden" role="tabpanel">
        <div class="control-scroll">
          <section class="control-section"><h2>工作流</h2>
            <button id="open-editor" class="command"><span class="command-icon">◇</span><span>打开工作流编辑器</span></button>
            <button data-editor-command="workflowSettings" class="command"><span class="command-icon">⚙</span><span>工作流设置</span></button>
          </section>
          <section class="control-section"><h2>查找卡片</h2>
            <div class="node-search-row"><input id="node-search" type="search" placeholder="输入卡片 name"><button id="find-node" class="primary">查找</button></div>
          </section>
          <section class="control-section"><h2>添加节点</h2>
            <div class="tool-grid">
              <button data-editor-command="addTask"><span class="node-swatch task"></span><span>Task</span></button>
              <button data-editor-command="addSelector"><span class="node-swatch selector"></span><span>Selector</span></button>
              <button data-editor-command="addSequence"><span class="node-swatch sequence"></span><span>Sequence</span></button>
              <button data-editor-command="addParallel"><span class="node-swatch parallel"></span><span>Parallel</span></button>
              <button data-editor-command="addInstanceParallel"><span class="node-swatch instance-parallel"></span><span>Instances</span></button>
            </div>
          </section>
          <section class="control-section"><h2>画布</h2>
            <div class="tool-grid compact-grid">
              <button data-editor-command="autoLayout"><span class="tool-icon">⌘</span><span>自动排列</span></button>
              <button data-editor-command="fitView"><span class="tool-icon">⌂</span><span>适应视口</span></button>
            </div>
            <button data-editor-command="exportImage" class="command"><span class="command-icon">⇩</span><span>导出完整画布</span></button>
          </section>
          <section class="control-section"><h2>工具</h2>
            <div class="run-actions"><div id="run-status" class="status idle"><span class="status-dot"></span><span id="status-text">就绪</span></div><button id="stop" class="icon-button">■</button></div>
            <button id="open-log" class="command"><span class="command-icon">☷</span><span>运行日志</span></button>
            <button id="open-tree" class="command"><span class="command-icon">≣</span><span>独立结构树</span></button>
            <button id="open-refs" class="command"><span class="command-icon">⇄</span><span>引用查看</span></button>
            <button id="validate" class="command"><span class="command-icon">✓</span><span>引擎校验</span></button>
          </section>
        </div>
      </div>
    </section>
    <section class="dock-pane variables-dock" aria-label="工作流变量">
      <div class="dock-tabs variable-tabs"><div class="dock-tab active static"><span>●</span><span>变量</span></div><button id="add-variable" class="dock-action">＋</button></div>
      <div class="dock-toolbar"><input id="variable-search" type="search" placeholder="搜索变量"></div>
      <div id="variable-list" class="sidebar-variable-list" role="listbox" aria-label="当前工作流变量"></div>
    </section>
  </main>
  <script>
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        document.documentElement.dataset.lastMessage = JSON.stringify(message);
        if (message.type === 'ready') setTimeout(() => window.dispatchEvent(new MessageEvent('message', { data: {
          type: 'editorState', root: 'root', selectedNode: 'invite', selectedVariable: 'invite_target_template',
          nodes: [
            { id: 'root', name: '开始', type: 'root', meta: 'root', children: ['main'] },
            { id: 'main', name: '邀请队友', type: 'sequence', meta: 'sequence', children: ['capture', 'invite'] },
            { id: 'capture', name: '截取画面', type: 'task', meta: 'core.capture', children: [] },
            { id: 'invite', name: '发送邀请', type: 'task', meta: 'input.tap_match', children: [] }
          ],
          variables: [
            { name: 'rounds', type: 'integer', public: true },
            { name: 'invite_target_template', type: 'asset', public: true },
            { name: 'retry_count', type: 'integer', public: false }
          ]
        } })), 0);
      }
    });
  </script>
  <script src="../media/sidebar.js"></script>
</body>
</html>
